name: LOTO seed search
on:
  push:
    branches: [main]
    paths:
      - 'data/loto6.csv'
      - 'data/loto7.csv'
      - 'import_history.py'
      - 'run_search.py'
      - 'worker.py'
      - 'seed_scan.cpp'
      - 'global_scan.cpp'
      - 'global_search.py'
      - 'main_search.py'
      - 'test_main.py'
      - 'evaluate_forecasts.py'
      - 'test_global.py'
      - 'test_native.py'
      - 'analyze.py'
      - '.github/workflows/seed-search.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: loto-seed-search
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile native seed scanner
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra seed_scan.cpp -o seed_scan
          g++ -O3 -std=c++17 -Wall -Wextra global_scan.cpp -o global_scan
      - name: Validate Python and cross-check exact matches
        run: |
          python -m compileall -q worker.py import_draws.py import_history.py analyze.py run_search.py global_search.py main_search.py evaluate_forecasts.py
          python -m unittest -q test_worker.py test_native.py test_global.py test_main.py
      - name: Search and checkpoint in D1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          RUN_SECONDS: '90'
          GLOBAL_BATCH_SIZE: '1000000'
          MAIN_BATCH_SIZE: '1000000'
          MAIN_RUN_SECONDS: '75'
          D1_RUN_READ_BUDGET: '60000'
          D1_RUN_WRITE_BUDGET: '2000'
        run: |
          python run_search.py
