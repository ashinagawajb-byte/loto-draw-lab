name: LOTO seed search
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: loto-seed-search
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python files
        run: |
          python -m compileall -q worker.py import_draws.py import_history.py analyze.py
          python -m unittest -q test_worker.py
      - name: Search and checkpoint in D1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          RUN_SECONDS: '90'
          BATCH_SIZE: '500'
        run: |
          python import_history.py
          python worker.py
          python analyze.py
