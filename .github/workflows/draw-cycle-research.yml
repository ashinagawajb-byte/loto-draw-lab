name: Draw cycle research validation
on:
  push:
    branches: [research/draw-2157-cycle]
    paths:
      - 'research/**'
      - '.github/workflows/draw-cycle-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify cycle models and archive retrospective
        run: |
          python -m unittest -q research.test_cycle_compare research.test_official_archives
          python research/draw_cycle.py --model all --main-only > /tmp/cycle_check.csv
          test -s /tmp/cycle_check.csv
      - name: Retrieve latest official video index (best effort)
        continue-on-error: true
        run: python research/update_official_archives.py --output research/official_archive_catalog.json
      - name: Package isolated browser comparison and retrospective
        run: |
          mkdir -p cycle-preview
          cp research/cycle_compare.html cycle-preview/index.html
          cp research/draw_retrospective.html cycle-preview/review.html
          cp research/draw-2157.md cycle-preview/observations.md
          if test -s research/official_archive_catalog.json; then
            cp research/official_archive_catalog.json cycle-preview/official_archive_catalog.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: draw2157-cycle-comparison-preview
          path: cycle-preview/
          retention-days: 14
