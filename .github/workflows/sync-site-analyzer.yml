name: Sync Site Analyzer fixed tickets
on:
  schedule:
    - cron: '40 9 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync_site_analyzer.py'
      - 'test_site_sync.py'
      - '.github/workflows/sync-site-analyzer.yml'
permissions:
  contents: write
concurrency:
  group: loto-site-analyzer-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate importer and import read-only export
        env:
          SITE_FIXED_CSV_URL: ${{ secrets.SITE_FIXED_CSV_URL }}
          SITE_EXPORT_AUTH: ${{ secrets.SITE_EXPORT_AUTH }}
        run: |
          python -m unittest -q test_site_sync.py
          python sync_site_analyzer.py
      - name: Create immutable comparison snapshot commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- comparisons/loto6-*-fixed-5tickets.csv)" ]; then
            echo "No new Analyzer export to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- comparisons/loto6-*-fixed-5tickets.csv
          git diff --cached --check
          git commit -m "Import Site Analyzer frozen five-ticket CSV"
          git push origin HEAD:main
