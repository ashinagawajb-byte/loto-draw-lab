name: LOTO research dashboard
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard.py'
      - '.github/workflows/dashboard.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: loto-dashboard-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build read-only dashboard from D1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          python -m compileall -q dashboard.py
          python dashboard.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
