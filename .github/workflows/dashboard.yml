name: LOTO research dashboard
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard.py'
      - 'incremental_seed.py'
      - 'data/analyzer_results.json'
      - 'sync_draw_registrations.py'
      - 'test_draw_registrations.py'
      - 'evaluate_forecasts.py'
      - 'compare_models.py'
      - 'comparisons/**'
      - 'test_comparisons.py'
      - 'predictions/**'
      - 'data/loto6.csv'
      - 'simulator/**'
      - 'test_simulator_cycle.py'
      - '.github/workflows/dashboard.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: loto-dashboard-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Register published draw results
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          python -m unittest -q test_draw_registrations.py
          python sync_draw_registrations.py
      - name: Refresh public Analyzer result history for scoring
        run: python incremental_seed.py --export
      - name: Build read-only dashboard from D1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          python -m compileall -q dashboard.py evaluate_forecasts.py compare_models.py
          python -m unittest -q test_comparisons.py test_simulator_cycle.py
          if ! python dashboard.py; then
            echo "::warning title=D1 quota::Could not refresh the dashboard; reusing the last public snapshot so the simulator can deploy."
            mkdir -p site
            curl --fail --location --silent --show-error --retry 3 --output site/index.html https://ashinagawajb-byte.github.io/loto-draw-lab/
            python -c 'from dashboard import attach_analyzer_result; attach_analyzer_result("site/index.html")'
          fi
          mkdir -p site/predictions
          cp predictions/loto[67]_*.json site/predictions/
          python -c 'import json, pathlib; files=sorted(pathlib.Path("site/predictions").glob("loto[67]_*.json")); pathlib.Path("site/predictions/index.json").write_text(json.dumps([p.name for p in files]))'
          mkdir -p site/simulator
          cp simulator/index.html simulator/review.html simulator/manifest.webmanifest simulator/sw.js simulator/analyzer-result.js site/simulator/
          python simulator/make_icons.py site/simulator
          test -s site/simulator/icon-192.png
          test -s site/simulator/icon-512.png
          test -s site/simulator/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Allow GitHub artifact metadata to become available
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
